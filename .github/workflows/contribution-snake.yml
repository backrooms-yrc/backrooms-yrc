name: Contribution snake

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/contribution-snake.yml]

permissions:
  contents: write

concurrency: contribution-snake

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ runner.temp }}/github-snake.svg?palette=github-light
            ${{ runner.temp }}/github-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git switch --track origin/output
          else
            git switch --orphan output
          fi

          cp "$RUNNER_TEMP/github-snake.svg" "$RUNNER_TEMP/github-snake-dark.svg" .
          git add -- github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update contribution snake'
          git push origin HEAD:refs/heads/output
